services:
  app:
    build:
      context: .
      dockerfile: infra/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      ENVIRONMENT: development
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DATABASE: sgu_campus_guide
      DEMO_MODE: "false"
    depends_on:
      mongo:
        condition: service_healthy
  mongo:
    image: mongo:8.0
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 2)"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  mongo_data:
