[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "sgu-campus-guide-api"
version = "0.1.0"
description = "API foundation for the Saigon University campus audio guide."
requires-python = ">=3.12,<3.13"
dependencies = [
    "edge-tts>=7,<8",
    "fastapi>=0.115,<1",
    "mutagen>=1.47,<2",
    "pwdlib[argon2]>=0.3,<1",
    "pydantic-settings>=2.7,<3",
    "pyjwt>=2.10,<3",
    "pymongo>=4.13,<5",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8,<10",
    "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "mongodb_integration: explicit read-only test against the configured MongoDB deployment",
    "mongodb_write_integration: explicit writes to isolated temporary test collections only",
]
